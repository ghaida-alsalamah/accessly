<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessly Test Page</title>
<!-- Temporary page for testing the database flow by hand. Not the final design. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #fff; color: #000; font: 16px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input[type=text], input[type=email], input[type=url] { width: 100%; padding: 8px; border: 1px solid #000; background: #fff; color: #000; font: inherit; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-weight: normal; }
  .check input { margin-top: 5px; }
  button { margin-top: 12px; padding: 8px 16px; border: 1px solid #000; background: #000; color: #fff; font: inherit; cursor: pointer; }
  button.plain { background: #fff; color: #000; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  a { color: #000; }
  ul.needs { padding: 0; list-style: none; }
  ul.needs li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #000; padding: 6px 0; overflow-wrap: anywhere; }
  ul.needs button { margin: 0; padding: 4px 10px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row button { margin-top: 0; }
  pre { border: 1px solid #000; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; text-align: start; }
  #message { border: 2px solid #000; padding: 8px; margin: 12px 0; }
  #message:empty { display: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar button { margin-top: 0; }
  header.bar { border-bottom: 1px solid #000; padding-bottom: 8px; }
  header p { margin: 0; flex: 1; min-width: 200px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="bar">
    <p><strong>Accessly</strong> — <span data-i18n="banner"></span></p>
    <button type="button" class="plain" id="lang-toggle"></button>
  </header>
  <div id="message" role="alert" aria-live="assertive"></div>

  <section id="screen-register">
    <h1 tabindex="-1" data-i18n="create_account"></h1>
    <form id="register-form">
      <label for="reg-name" data-i18n="name"></label>
      <input id="reg-name" type="text" required maxlength="100" autocomplete="name" dir="auto">
      <label for="reg-email" data-i18n="email"></label>
      <input id="reg-email" type="email" required maxlength="100" autocomplete="email" dir="ltr">
      <label class="check">
        <input id="reg-consent" type="checkbox">
        <span><span data-i18n="agree_1"></span><a id="privacy-link" target="_blank" rel="noopener" data-i18n="privacy"></a><span data-i18n="agree_2"></span><a id="terms-link" target="_blank" rel="noopener" data-i18n="terms"></a><span data-i18n="agree_3"></span></span>
      </label>
      <p data-i18n="language_note"></p>
      <button type="submit" data-i18n="register_button"></button>
    </form>

    <h2 data-i18n="already"></h2>
    <form id="login-form">
      <label for="login-email" data-i18n="email"></label>
      <input id="login-email" type="email" required maxlength="100" autocomplete="email" dir="ltr">
      <button type="submit" data-i18n="send_login"></button>
    </form>
  </section>

  <section id="screen-otp" hidden>
    <h1 tabindex="-1" data-i18n="enter_code"></h1>
    <p><span data-i18n="code_sent_1"></span><strong id="otp-email" dir="ltr"></strong><span data-i18n="code_sent_2"></span></p>
    <form id="otp-form">
      <label for="otp-code" data-i18n="code"></label>
      <input id="otp-code" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" dir="ltr">
      <button type="submit" data-i18n="verify"></button>
      <button type="button" class="plain" id="otp-resend" data-i18n="resend"></button>
      <button type="button" class="plain" id="otp-back" data-i18n="back"></button>
    </form>
  </section>

  <section id="screen-main" hidden>
    <div class="bar">
      <h1 tabindex="-1"><span data-i18n="hello"></span><span id="user-name" dir="auto"></span></h1>
      <button type="button" class="plain" id="logout" data-i18n="logout"></button>
    </div>

    <h2 data-i18n="needs_title"></h2>
    <ul class="needs" id="needs"></ul>
    <p id="needs-empty" data-i18n="no_needs"></p>
    <form id="need-form">
      <label for="need-input" data-i18n="add_need"></label>
      <div class="row">
        <input id="need-input" type="text" required maxlength="1000" dir="auto">
        <button type="submit" data-i18n="add"></button>
      </div>
    </form>

    <h2 data-i18n="check_event"></h2>
    <form id="event-form">
      <label for="event-url" data-i18n="event_url"></label>
      <div class="row">
        <input id="event-url" type="url" required placeholder="https://" dir="ltr">
        <button type="submit" data-i18n="check"></button>
      </div>
    </form>
    <p id="job-status" aria-live="polite"></p>
    <pre id="job-result" dir="ltr" hidden></pre>

    <div class="bar">
      <h2 data-i18n="my_requests"></h2>
      <button type="button" class="plain" id="requests-refresh" data-i18n="refresh"></button>
    </div>
    <pre id="requests" dir="ltr"></pre>

    <h2 data-i18n="delete_title"></h2>
    <p data-i18n="delete_note"></p>
    <button type="button" class="plain" id="delete-account" data-i18n="delete_button"></button>
  </section>
</main>

<script>
const TEXT = {
  en: {
    banner: "Temporary test page, for testing the database only.",
    other_language: "العربية",
    create_account: "Create an account",
    name: "Name",
    email: "Email",
    agree_1: "I agree to the ",
    privacy: "Privacy Policy",
    agree_2: " and the ",
    terms: "Terms and Conditions",
    agree_3: ".",
    language_note: "Your emails will be in English. To change this, use the language button at the top.",
    register_button: "Register and send code",
    already: "Already registered?",
    send_login: "Send login code",
    enter_code: "Enter your code",
    code_sent_1: "A 6-digit code was sent for ",
    code_sent_2: ". It expires in 5 minutes.",
    code: "Code",
    verify: "Verify",
    resend: "Resend code",
    back: "Back",
    hello: "Hello, ",
    logout: "Log out",
    needs_title: "Accessibility needs",
    saved_needs: "Saved needs",
    no_needs: "No needs saved yet.",
    add_need: "Add a need",
    add: "Add",
    remove: "Remove",
    check_event: "Check an event",
    event_url: "Event URL",
    check: "Check",
    my_requests: "My requests",
    refresh: "Refresh",
    no_requests: "No requests yet.",
    checking: "Checking the event. This can take a few minutes...",
    finished: "Finished: ",
    must_agree: "You must agree to the Privacy Policy and the Terms and Conditions to register.",
    resent: "If the email is registered, a new code was sent. A code can be resent once a minute.",
    expired: "Your session expired. Log in again.",
    failed: "Request failed (HTTP {status}).",
    delete_title: "Delete my account",
    delete_note: "This permanently deletes your account, needs, and requests.",
    delete_button: "Delete my account",
    delete_confirm: "Delete your account and all your data permanently? This can't be undone.",
    deleted: "Your account and all your data were deleted.",
  },
  ar: {
    banner: "صفحة اختبار مؤقتة، لاختبار قاعدة البيانات فقط.",
    other_language: "English",
    create_account: "إنشاء حساب",
    name: "الاسم",
    email: "البريد الإلكتروني",
    agree_1: "أوافق على ",
    privacy: "سياسة الخصوصية",
    agree_2: " و",
    terms: "الشروط والأحكام",
    agree_3: ".",
    language_note: "ستصلك الرسائل باللغة العربية. لتغييرها استخدم زر اللغة في الأعلى.",
    register_button: "التسجيل وإرسال الرمز",
    already: "لديك حساب؟",
    send_login: "إرسال رمز الدخول",
    enter_code: "أدخل الرمز",
    code_sent_1: "أرسلنا رمزاً من 6 أرقام إلى ",
    code_sent_2: ". الرمز صالح لمدة 5 دقائق.",
    code: "الرمز",
    verify: "تحقق",
    resend: "إعادة إرسال الرمز",
    back: "رجوع",
    hello: "مرحباً، ",
    logout: "تسجيل الخروج",
    needs_title: "احتياجات الإتاحة",
    saved_needs: "الاحتياجات المحفوظة",
    no_needs: "لا توجد احتياجات محفوظة بعد.",
    add_need: "إضافة احتياج",
    add: "إضافة",
    remove: "حذف",
    check_event: "فحص فعالية",
    event_url: "رابط الفعالية",
    check: "فحص",
    my_requests: "طلباتي",
    refresh: "تحديث",
    no_requests: "لا توجد طلبات بعد.",
    checking: "جارٍ فحص الفعالية. قد يستغرق ذلك بضع دقائق...",
    finished: "انتهى: ",
    must_agree: "يجب الموافقة على سياسة الخصوصية والشروط والأحكام للتسجيل.",
    resent: "إذا كان البريد مسجلاً فقد أُرسل رمز جديد. يمكن إعادة إرسال الرمز مرة كل دقيقة.",
    expired: "انتهت الجلسة. سجّل الدخول من جديد.",
    failed: "تعذّر تنفيذ الطلب (HTTP {status}).",
    delete_title: "حذف حسابي",
    delete_note: "يحذف هذا حسابك واحتياجاتك وطلباتك نهائياً.",
    delete_button: "حذف حسابي",
    delete_confirm: "هل تريد حذف حسابك وكل بياناتك نهائياً؟ لا يمكن التراجع عن ذلك.",
    deleted: "تم حذف حسابك وكل بياناتك.",
  },
};

// The JWT lives only in this variable: reloading the page logs you out.
let token = null;
let email = null;
let needs = [];
let requests = null;
// Browser language until login; after login, the user's preferred_language.
let lang = (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";

const $ = (id) => document.getElementById(id);
const t = (key) => TEXT[lang][key];

function setLang(next) {
  lang = next;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  const toggle = $("lang-toggle");
  toggle.textContent = t("other_language");
  toggle.lang = lang === "ar" ? "en" : "ar";
  $("privacy-link").href = "/test/policy/privacy/" + lang;
  $("terms-link").href = "/test/policy/terms/" + lang;
  $("needs").setAttribute("aria-label", t("saved_needs"));
  renderNeeds(needs);
  renderRequests();
}

$("lang-toggle").addEventListener("click", (e) => busy(e.target.parentElement, async () => {
  const next = lang === "ar" ? "en" : "ar";
  // Logged in: save it, so emails and the next login use it too.
  if (token) await api("PUT", "/api/profile/language", { preferred_language: next });
  setLang(next);
}));

function show(screen) {
  for (const name of ["register", "otp", "main"]) $("screen-" + name).hidden = name !== screen;
  $("screen-" + screen).querySelector("h1").focus();
}

function say(text) { $("message").textContent = text || ""; }

function describe(detail) {
  if (Array.isArray(detail)) return detail.map((d) => (d.loc || []).slice(1).join(".") + ": " + d.msg).join("; ");
  return detail;
}

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (response.status === 401 && token) {
    logout(t("expired"));
    throw new Error("Session expired.");
  }
  if (!response.ok) throw new Error(describe(data.detail) || t("failed").replace("{status}", response.status));
  return data;
}

// Disables the buttons in `container` while the request runs and shows any error.
async function busy(container, action) {
  const buttons = container.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  say("");
  try { await action(); }
  catch (error) { if (error.message !== "Session expired.") say(error.message); }
  finally { buttons.forEach((b) => (b.disabled = false)); }
}

async function sendCode(address) {
  await api("POST", "/auth/send-otp", { email: address });
  email = address;
  $("otp-email").textContent = address;
  $("otp-code").value = "";
  show("otp");
}

$("register-form").addEventListener("submit", (e) => {
  e.preventDefault();
  busy(e.target, async () => {
    if (!$("reg-consent").checked) throw new Error(t("must_agree"));
    await api("POST", "/auth/register", {
      name: $("reg-name").value,
      email: $("reg-email").value,
      preferred_language: lang,
      consent: true,
    });
    await sendCode($("reg-email").value);
  });
});

$("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  busy(e.target, () => sendCode($("login-email").value));
});

$("otp-form").addEventListener("submit", (e) => {
  e.preventDefault();
  busy(e.target, async () => {
    const result = await api("POST", "/auth/verify-otp", { email, code: $("otp-code").value });
    token = result.access_token;
    await loadMain();
  });
});

$("otp-resend").addEventListener("click", () => busy($("otp-form"), async () => {
  await sendCode(email);
  say(t("resent"));
}));

$("otp-back").addEventListener("click", () => { say(""); show("register"); });

function logout(text) {
  token = null;
  email = null;
  requests = null;
  // Clear everything the last user saw, so the next user on this browser can't see it.
  renderNeeds([]);
  renderRequests();
  $("user-name").textContent = "";
  $("job-status").textContent = "";
  $("job-result").textContent = "";
  $("job-result").hidden = true;
  for (const form of document.querySelectorAll("form")) form.reset();
  say(text);
  show("register");
}

$("logout").addEventListener("click", () => logout(""));

$("delete-account").addEventListener("click", (e) => {
  if (!confirm(t("delete_confirm"))) return;
  busy(e.target.parentElement, async () => {
    const response = await fetch("/api/account", { method: "DELETE", headers: { Authorization: "Bearer " + token } });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(describe(data.detail) || t("failed").replace("{status}", response.status));
    }
    logout(t("deleted"));
  });
});

async function loadMain() {
  const profile = await api("GET", "/api/profile");
  $("user-name").textContent = profile.name;
  needs = profile.needs;
  await loadRequests();
  setLang(profile.preferred_language === "ar" ? "ar" : "en");
  show("main");
}

function renderNeeds(list) {
  needs = list;
  const ul = $("needs");
  ul.replaceChildren();
  for (const need of needs) {
    const li = document.createElement("li");
    const text = document.createElement("span");
    text.dir = "auto";
    text.textContent = need;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "plain";
    remove.textContent = t("remove");
    remove.setAttribute("aria-label", t("remove") + " " + need);
    remove.dataset.need = need;
    remove.addEventListener("click", () => busy(ul, () => saveNeeds(needs.filter((n) => n !== need))));
    li.append(text, remove);
    ul.append(li);
  }
  $("needs-empty").hidden = needs.length > 0;
}

async function saveNeeds(list) {
  const profile = await api("POST", "/api/profile", { needs: list });
  renderNeeds(profile.needs);
}

$("need-form").addEventListener("submit", (e) => {
  e.preventDefault();
  busy(e.target, async () => {
    await saveNeeds([...needs, $("need-input").value]);
    $("need-input").value = "";
  });
});

function renderRequests() {
  // JSON reads left to right; the "no requests" sentence follows the page language.
  $("requests").dir = requests && requests.length ? "ltr" : "auto";
  if (requests === null) $("requests").textContent = "";
  else if (!requests.length) $("requests").textContent = t("no_requests");
  else $("requests").textContent = JSON.stringify(requests, null, 2);
}

async function loadRequests() {
  requests = await api("GET", "/api/requests");
  renderRequests();
}

$("requests-refresh").addEventListener("click", (e) => busy(e.target.parentElement, loadRequests));

$("event-form").addEventListener("submit", (e) => {
  e.preventDefault();
  busy(e.target, async () => {
    $("job-result").hidden = true;
    let job = await api("POST", "/api/events", { url: $("event-url").value });
    $("job-status").textContent = t("checking");
    while (job.status === "processing") {
      await new Promise((resolve) => setTimeout(resolve, 3000));
      if (!token) return;
      job = await api("GET", "/api/jobs/" + job.id);
    }
    $("job-status").textContent = t("finished") + job.status;
    $("job-result").textContent = JSON.stringify(job.result || job.response, null, 2);
    $("job-result").hidden = false;
    await loadRequests();
  });
});

setLang(lang);
</script>
</body>
</html>
